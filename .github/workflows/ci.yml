name: Validación del Command Center
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Perticari_Command_Center_Repo_Starter_v0.1/perticari-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Perticari_Command_Center_Repo_Starter_v0.1/perticari-command-center/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
